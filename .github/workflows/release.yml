name: Release Windows installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    runs-on: windows-latest
    outputs:
      installer: ${{ steps.version.outputs.installer }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Verify release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargoVersion = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -cne "v$version" -or $cargoVersion -cne $version) {
            throw "Release tag, package.json, and Cargo.toml must agree on a stable version."
          }
          "installer=TermBee_${version}_x64-setup.exe" >> $env:GITHUB_OUTPUT
      - run: npm ci
      - run: npm run lint
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build the Windows x64 installer
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/${{ steps.version.outputs.installer }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-installer
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INSTALLER: ${{ needs.build.outputs.installer }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$INSTALLER" \
            --verify-tag \
            --title "TermBee $GITHUB_REF_NAME" \
            --generate-notes
